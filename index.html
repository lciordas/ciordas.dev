<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucas Ciordas</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px;
    }
    main { max-width: 560px; }
    h1 { font-size: 2.2rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Lucas Ciordas</h1>
    <p>This is my corner of the internet. Big things in the works.</p>
    <p><a href="https://github.com/lciordas">GitHub</a></p>
  </main>
</body>
</html>
